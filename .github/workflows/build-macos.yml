name: Build macOS

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: macOS (ARM64)
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: macos-aarch64-apple-darwin

      - name: Install frontend dependencies
        run: npm ci

      - name: Build DMG
        env:
          # Ad-hoc signing works without an Apple Developer certificate.
          APPLE_SIGNING_IDENTITY: '-'
        run: npm run tauri -- build --ci --target aarch64-apple-darwin --bundles app,dmg -- --locked

      - name: Check packaged app startup
        run: python3 scripts/smoke-macos.py src-tauri/target/aarch64-apple-darwin/release/bundle/macos/zcode-switch.app

      - name: Collect DMG and checksums
        shell: bash
        run: |
          mkdir -p dist-macos
          cp src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg dist-macos/
          cd dist-macos
          shasum -a 256 ./*.dmg > SHA256SUMS.txt

      - name: Upload macOS installer
        uses: actions/upload-artifact@v4
        with:
          name: zcode-switch-macos-aarch64
          path: dist-macos/
          if-no-files-found: error
          retention-days: 30
